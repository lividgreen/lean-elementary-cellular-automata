name = "elementary_cellular_automata"
version = "0.1.0"
keywords = ["math", "cellular-automata", "elementary-cellular-automata", "learning-theory"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[require]]
name = "classical_upstream"
git = "https://github.com/lividgreen/lean-classical-upstream"
rev = "v0.2.0"

[[lean_lib]]
name = "CellularAutomata"
# The glob must include the root itself (`<Root>.*` matches the root and its submodules),
# for the same reason as the `ALT` library of the package that requires this one.
roots = ["CellularAutomata"]
globs = ["CellularAutomata.*"]
